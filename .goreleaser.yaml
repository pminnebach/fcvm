version: 2

project_name: fcvm

builds:
  - id: fcvm
    main: .
    binary: fcvm
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
    flags:
      - -buildvcs=false
    ldflags:
      - -s -w -X github.com/pminnebach/fcvm/cmd.version={{ if .IsSnapshot }}{{ .ShortCommit }}{{ else }}{{ .Version }}{{ end }}
  - id: fcvm-guest-agent
    main: ./guest/agent
    binary: fcvm-guest-agent
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
    flags:
      - -buildvcs=false
    ldflags:
      - -s -w

before:
  hooks:
    - go mod tidy
    - go mod verify

archives:
  - formats: [tar.gz]

# Pass curated notes: goreleaser release --release-notes docs/release_notes.md --clean
# Do not set changelog.disable — it ignores --release-notes and publishes an empty body.
release:
  mode: replace
